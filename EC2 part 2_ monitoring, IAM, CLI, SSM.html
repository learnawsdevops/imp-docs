<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>EC2 notes part 2: monitoring, IAM, CLI, SSM</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap">
<style>
:root{--bg:#f6f8fb;--card:#fff;--ink:#16202e;--mut:#5b6778;--line:#d9e0ea;--a:#3b6cf0;--t:#c27a00;--s:#1f9d6b;--bad:#d6453d;--as:#e6edff;--ts:#fff1d6;--ss:#dcf5ea;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e141d;--card:#17202c;--ink:#e8eef7;--mut:#9aa7b9;--line:#2a3646;--a:#7da0ff;--t:#f2b43a;--s:#4fd19a;--bad:#ff7a70;--as:#1d2a4d;--ts:#40320f;--ss:#143a2c;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e141d;--card:#17202c;--ink:#e8eef7;--mut:#9aa7b9;--line:#2a3646;--a:#7da0ff;--t:#f2b43a;--s:#4fd19a;--bad:#ff7a70;--as:#1d2a4d;--ts:#40320f;--ss:#143a2c;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 "Bricolage Grotesque",system-ui,-apple-system,Segoe UI,sans-serif}
main{max-width:860px;margin:0 auto;padding:20px 16px 60px}
h1{font-size:clamp(28px,6vw,42px);line-height:1.1;margin:8px 0 10px;font-weight:800}
h2{font-size:24px;margin:44px 0 6px;font-weight:800}h3{margin:0 0 4px;font-size:18px}p{margin:6px 0}.mut{color:var(--mut)}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
button{font:inherit;cursor:pointer;color:var(--ink)}
.theme,.btn{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 14px}.theme{border-radius:20px;padding:4px 12px}
.btn.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.one{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-top:14px}
.a{color:var(--a);font-weight:800}.t{color:var(--t);font-weight:800}.s{color:var(--s);font-weight:800}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));margin-top:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;border-top:5px solid var(--c)}
.svgbox{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px;margin-top:12px}
svg{width:100%;height:auto;display:block}svg text{font-family:inherit;fill:var(--ink)}
.n{cursor:pointer}.n rect{stroke-width:2;transition:.2s}.n:hover rect,.n:focus rect{stroke-width:4}
.n.hi rect{stroke-width:5;filter:drop-shadow(0 0 6px var(--sc))}.n.dim{opacity:.35}
.ln{stroke:var(--mut);stroke-width:2;fill:none}.flow{stroke-dasharray:6 6;animation:d 1s linear infinite}
@keyframes d{to{stroke-dashoffset:-12}}@media (prefers-reduced-motion:reduce){.flow{animation:none}}
.info,.ans{margin-top:10px;padding:12px 14px;border-radius:12px;background:var(--card);border:1px solid var(--line);border-left:6px solid var(--mut);min-height:60px}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.steps{margin:10px 0 0;padding:0;list-style:none}
.steps li{padding:8px 12px;margin:6px 0;border-radius:10px;border:1px solid var(--line);background:var(--card);opacity:.45}
.steps li.cur{opacity:1;border-color:var(--ink);font-weight:600}.steps li.done{opacity:.85}
.tw{overflow-x:auto;margin-top:10px;border:1px solid var(--line);border-radius:12px;background:var(--card)}
table{border-collapse:collapse;width:100%;min-width:520px;font-size:14.5px}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}th{background:var(--bg)}td:first-child{font-weight:600}
code{font:13.5px ui-monospace,Menlo,Consolas,monospace;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:1px 6px;word-break:break-all}
.bad{color:var(--bad)}
.agree{display:grid;gap:10px;margin-top:12px}.ag{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.tg span{display:inline-block;font-size:13px;font-weight:600;padding:1px 9px;border-radius:12px;margin:0 6px 4px 0}
.mix div{padding:10px 12px;background:var(--card);border:1px solid var(--line);border-radius:12px;margin:8px 0}
.q{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:12px}
.opt{display:block;width:100%;text-align:left;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 12px;margin:6px 0}
.opt.ok{border-color:var(--s);background:var(--ss)}.opt.no{border-color:var(--bad)}
.cheat{background:var(--ink);color:var(--bg);border-radius:14px;padding:16px;margin-top:12px}.cheat div{margin:6px 0}.cheat code{color:var(--ink)}
.dec{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}.dec div{flex:1 1 150px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}.dec b{display:block;font-size:24px}
</style></head><body><main id="app"></main>
<script>
const D={
part:"EC2 notes, part 2 of 2",title:"Watch it, alert on it, and control who can touch it",
sub:"From your class notes (20 to 24 Nov): CloudWatch, SNS, EventBridge, IAM, AWS CLI, Systems Manager and secrets.",
one:"<span class='a'>CloudWatch</span> watches, <span class='a'>SNS and EventBridge</span> tell and react, <span class='t'>IAM</span> decides who can do what, and <span class='t'>SSM</span> lets you manage servers without opening the door.",
aTitle:"Think of an office building",
analogy:[["CloudWatch = the security cameras","Records what is happening (CPU, network, logs). An alarm is the guard who rings the bell when a limit is crossed.","a"],["SNS and EventBridge = speaker and reflexes","SNS sends the message to your email. EventBridge reacts: “when X happens, do Y”.","a"],["IAM, SSM, Secrets = badges and a safe","IAM badges say who can enter where. SSM is a maintenance crew with a service entrance. Secrets sit in a safe.","t"]],
dNote:"Blue boxes watch and notify. Amber boxes control access and secrets. Green is the server.",
diagram:{h:360,nodes:[["you",20,30,140,64,"You (IAM user)","no direct rights","t"],["role",20,148,140,64,"IAM role","permissions","t"],["ssm",20,266,140,64,"Systems Manager","agent on server","t"],["par",270,20,160,60,"Parameter / Secrets","stored values","t"],["ec2",270,130,160,100,"EC2 instance","+ CloudWatch agent","s"],["eb",270,280,160,60,"EventBridge","reacts to events","a"],["cw",520,30,160,64,"CloudWatch","metrics and logs","a"],["alarm",520,148,160,64,"Alarm","threshold + action","a"],["sns",520,266,160,64,"SNS","email alert","a"]],
edges:[["you","role"],["role","ec2"],["ssm","ec2"],["par","ec2"],["ec2","cw"],["cw","alarm"],["alarm","sns"],["ec2","eb"],["eb","sns"]],
info:{you:"An IAM user with no permissions of their own. Safer: if the password leaks, nothing can be done until they switch into a role.",role:"A set of permissions that can be assumed. Attach it to EC2 (for example for the CloudWatch agent or SSM) or let a user switch into it.",ssm:"The SSM agent inside the instance lets you open sessions, run commands and see processes. Needs the role policy AmazonSSMManagedInstanceCore.",par:"Parameter Store: free, static values. Secrets Manager: paid, sensitive values that rotate. Apps read them instead of hardcoding.",ec2:"By default CloudWatch sees CPU, network and disk operations only. Memory, disk space and web logs need the CloudWatch agent.",eb:"Event-driven: “when an instance stops”, “when a file lands in S3”, “when an IAM user is created”. It can notify or trigger actions and run on schedules.",cw:"Collects metrics. Basic updates every 5 minutes, Detailed every 1 minute (extra cost, same graphs).",alarm:"Metric + threshold + period + action. Example: CPU at 80% or more for 5 minutes, then email, stop, reboot or recover.",sns:"Simple Notification Service. Create a topic, add your email as a subscription, then confirm it from your inbox."}},
scen:{"CPU hits 80%":[["Install <code>stress</code> and run <code>stress --cpu 2 --timeout 300</code> to add load.",["ec2"]],["CloudWatch graphs the CPU metric (every 5 min basic, 1 min detailed).",["ec2","cw"]],["The alarm sees CPU at 80% or more for the set period.",["alarm"]],["The alarm action fires: SNS sends an email (or stop, reboot, recover, ASG).",["alarm","sns"]]],
"Instance stops, get alerted":[["An EC2 instance changes state to stopped.",["ec2"]],["EventBridge matches the event rule.",["eb"]],["It sends the notification through SNS to your email.",["eb","sns"]]],
"Secure user access":[["Create an IAM user with no policy at all.",["you"]],["Create a role with the needed policy (like S3 full access) and set who can assume it.",["role"]],["Give the user an inline policy allowing only <code>sts:AssumeRole</code> on that role.",["you","role"]],["The user chooses Switch Role and works with temporary access.",["you","role"]]],
"Connect without port 22":[["Attach an IAM role with <code>AmazonSSMManagedInstanceCore</code> to the instance.",["role","ec2"]],["The SSM agent inside the instance talks out to Systems Manager.",["ssm","ec2"]],["Open Session Manager. No key pair, no port 22.",["ssm"]]]},
tTitle:"Settings and facts to know",
tabs:{"CloudWatch":{h:["Thing","What it does","Remember"],r:[["Basic vs Detailed","5 min vs 1 min updates","Detailed costs extra and adds no new graphs"],["Alarm: metric","CPU, network, disk, memory","Default metrics lack memory and disk space"],["Alarm: threshold","Value and period","Example: 80% or more for 5 minutes. States: OK, In alarm"],["Alarm: action","Notify or act","Stop, reboot, terminate, recover, ASG, or email through SNS"],["SNS","Sends alerts","Standard topic, add subscription, <span class='bad'>confirm the email or nothing arrives</span>"],["CloudWatch agent","Sends memory, disk, web logs","Needs an IAM role with CloudWatchAgentServerPolicy and AmazonSSMFullAccess"],["Logs Insights","Query logs","Filter for error, exception, fail in a log group like httpd_logs"],["EventBridge","React to events and schedules","Rules for events, input path and template to shape the message"]]},
"IAM and access":{h:["Thing","What it is","Remember"],r:[["Root user","Full rights on the account","Avoid daily use"],["IAM user","Individual user per person","Limit to their job role"],["Policy","Set of permissions","Like S3FullAccess or EC2FullAccess"],["Console access","Username, password, sign-in URL","Browser"],["Programmatic access","Access key ID and secret key","<span class='bad'>Stored in plain text on your laptop. Rotate every 60 to 90 days</span>"],["Switch role","User assumes a role","User has no rights, so a leaked password alone is not enough"],["Trust policy","Who can assume the role","Principal is the user’s ARN, action <code>sts:AssumeRole</code>"],["STS","Security Token Service","Issues temporary, limited credentials"]]},
"Systems Manager":{h:["Feature","What it does","Remember"],r:[["Session Manager","Shell without port 22 or key pair","Needs SSM agent and the managed-instance role policy"],["Fleet Manager","Linux: processes, users, file systems. Windows: GUI","Browser-based"],["Run Command","Run commands on tens or hundreds of instances","No need to log in"],["Parameter Store","Stores less sensitive values","Free, but the value is static and cannot rotate"],["Secrets Manager","Stores sensitive values","Rotates, replicates to another region. $0.40 per secret per month plus API calls"]]}},
cTitle:"Commands from your notes",
cmds:{"AWS CLI":{h:["Command","What it does"],r:[["<code>aws --version</code>","Check the CLI is installed"],["<code>aws configure</code>","Save access key, secret key, region, output format"],["<code>aws configure --profile dev</code>","Same, for a named account (dev, uat, prd)"],["<code>aws s3 ls --profile prd</code>","Run a command as that profile"],["<code>aws sts get-caller-identity</code>","Show who you are right now"],["<code>aws login --profile dev</code>","Newer, recommended: temporary credentials, nothing stored in plain text"],["<code>aws ec2 describe-volumes --query ... --output table</code>","List volumes, pick fields, show as a table"]]},
"On the server":{h:["Command","What it does"],r:[["<code>sudo dnf install stress -y</code>","Install a load generator"],["<code>nproc</code>","Count the CPUs"],["<code>stress --cpu 2 --timeout 300</code>","Load 2 CPUs for 5 minutes"],["<code>stress --vm 2 --vm-bytes 512M --timeout 300</code>","Load memory"],["<code>sudo dnf install amazon-ssm-agent -y</code>","Install the SSM agent"],["<code>sudo systemctl enable amazon-ssm-agent --now</code>","Start the agent and keep it on at boot. Use <code>status</code> to check"]]}},
picks:[{title:"Parameter Store or Secrets Manager?",intro:"Tap what you need to store.",items:[["A normal app setting","<b>Parameter Store.</b> Free. The value stays fixed until you change it."],["A database password that must rotate","<b>Secrets Manager.</b> Automatic rotation, optional cross-region replication, costs $0.40 per secret per month."],["Credentials hardcoded in code","<b>Don’t.</b> Store them in either service and let the app read them."]]},
{title:"Interview questions",intro:"Tap a question to reveal a short answer.",items:[["Connect to EC2 without port 22 or a key pair?","Use <b>Session Manager</b>. The SSM agent in the instance does the work. Attach a role with AmazonSSMManagedInstanceCore."],["Why can’t default CloudWatch show memory?","It only sees hypervisor-level metrics. Install the <b>CloudWatch agent</b> to send memory, disk space and web server logs."],["Why use switch role instead of direct permissions?","If the user’s credentials leak, the attacker still has no rights. Access exists only after assuming the role."],["Problem with access keys on a laptop?","They sit in plain text in the .aws folder. Rotate them every 60 to 90 days, or use CloudShell or <code>aws login</code>."],["Detailed monitoring: new graphs?","No. Same graphs, updated every minute instead of every 5, at extra cost."]]}],
agree:[["Instance role",[["IAM role","t"],["EC2","s"]],"For the CloudWatch agent or SSM to work, the instance must have the right role attached."],["Role trust",[["Trust policy","t"],["IAM user","t"]],"The role must name the user, and the user must be allowed <code>sts:AssumeRole</code>. Both sides, or it fails."],["Email alerts",[["SNS","a"],["Your inbox","n"]],"The subscription must be confirmed from your email first."],["Memory alarms",[["Alarm","a"],["CloudWatch agent","a"]],"No agent means no memory metric, so no memory alarm."],["Agent config",[["Agent","a"],["Parameter Store","t"]],"The agent can fetch its configuration from a stored location."]],
mix:["<b>CloudWatch vs EventBridge?</b> CloudWatch watches numbers over time. EventBridge reacts to things that happen.","<b>Parameter Store vs Secrets Manager?</b> Free and static versus paid and rotating.","<b>Root vs IAM user?</b> Root has full rights. Create individual users with limited policies.","<b>Access keys vs temporary credentials?</b> Keys are long-lived and risky. STS and <code>aws login</code> give short-lived ones."],
quiz:[["Which tool sends your email when an alarm fires?",["EventBridge","SNS","IAM"],1,"Alarms use SNS topics to email you."],["What is missing from default CloudWatch metrics?",["CPU","Network","Memory"],2,"Memory, disk space and web logs need the agent."],["Which gives free but static secret values?",["Parameter Store","Secrets Manager","STS"],0,"Secrets Manager adds rotation for a price."],["Which policy lets an EC2 instance be managed by SSM?",["EC2FullAccess","AmazonSSMManagedInstanceCore","S3FullAccess"],1,"Attach it through an instance role."],["What does the switch-role user need in their own policy?",["sts:AssumeRole","s3:*","ec2:*"],0,"Only permission to assume the role."]],
cheat:["<b>CloudWatch:</b> basic 5 min · detailed 1 min · agent for memory, disk, logs","<b>Alarm:</b> metric + threshold + period + action (SNS email, stop, reboot, recover)","<b>EventBridge:</b> event or schedule → target","<b>IAM:</b> root · user · policy · role · keys rotate every 60 to 90 days","<b>Switch role:</b> user with no policy + role trust + <code>sts:AssumeRole</code>","<b>SSM:</b> Session Manager (no 22, no key) · Fleet · Run Command · Parameter Store · Secrets Manager","<b>CLI:</b> <code>aws configure --profile dev</code> · <code>aws sts get-caller-identity</code> · <code>aws login</code>"]};

const $=s=>document.querySelector(s),C={a:"var(--a)",t:"var(--t)",s:"var(--s)",n:"var(--mut)"},S={a:"var(--as)",t:"var(--ts)",s:"var(--ss)",n:"var(--card)"};
try{const v=localStorage.getItem("th");if(v)document.documentElement.dataset.theme=v}catch(e){}
const N={};D.diagram.nodes.forEach(n=>N[n[0]]=n);
function edge(a,b){const A=N[a],B=N[b],ax=A[1]+A[3]/2,ay=A[2]+A[4]/2,bx=B[1]+B[3]/2,by=B[2]+B[4]/2,dx=bx-ax,dy=by-ay;
const cl=(n,x,y,k)=>{const t=k*Math.min(n[3]/2/Math.abs(x||1e-9),n[4]/2/Math.abs(y||1e-9)),cx=n[1]+n[3]/2,cy=n[2]+n[4]/2;return[cx+x*t,cy+y*t]};
const p=cl(A,dx,dy,1),q=cl(B,-dx,-dy,1.07);return `<path class="ln flow" d="M${p[0]} ${p[1]}L${q[0]} ${q[1]}" marker-end="url(#ar)"/>`}
function node(n){const c=n[7];return `<g class="n" data-k="${n[0]}" tabindex="0" style="--sc:${C[c]}"><rect x="${n[1]}" y="${n[2]}" width="${n[3]}" height="${n[4]}" rx="12" fill="${S[c]}" stroke="${C[c]}"/><text x="${n[1]+n[3]/2}" y="${n[2]+n[4]/2-(n[6]?2:-5)}" text-anchor="middle" font-weight="800" style="fill:${C[c]}">${n[5]}</text>${n[6]?`<text x="${n[1]+n[3]/2}" y="${n[2]+n[4]/2+16}" text-anchor="middle" font-size="12.5">${n[6]}</text>`:""}</g>`}
function tabs(id,T){return `<div class="btns" id="${id}b">${Object.keys(T).map((k,i)=>`<button class="btn${i?"":" on"}" data-k="${k}">${k}</button>`).join("")}</div><div class="tw"><table><thead id="${id}h"></thead><tbody id="${id}t"></tbody></table></div>`}
function wireTabs(id,T){const f=k=>{$("#"+id+"h").innerHTML="<tr>"+T[k].h.map(x=>"<th>"+x+"</th>").join("")+"</tr>";$("#"+id+"t").innerHTML=T[k].r.map(r=>"<tr>"+r.map(x=>"<td>"+x+"</td>").join("")+"</tr>").join("")};
document.querySelectorAll("#"+id+"b .btn").forEach(b=>b.onclick=()=>{document.querySelectorAll("#"+id+"b .btn").forEach(x=>x.classList.toggle("on",x===b));f(b.dataset.k)});f(Object.keys(T)[0])}
let h=`<div class="top"><span class="mut">${D.part}</span><button class="theme" id="th">Dark / Light</button></div><h1>${D.title}</h1><p class="mut">${D.sub}</p><div class="one">${D.one}</div>`;
h+=`<h2>${D.aTitle}</h2><div class="grid">${D.analogy.map(a=>`<div class="card" style="--c:${C[a[2]]}"><h3 class="${a[2]}">${a[0]}</h3><p>${a[1]}</p></div>`).join("")}</div>`;
if(D.extra)h+=D.extra;
h+=`<h2>The big picture (tap any box)</h2><p class="mut">${D.dNote}</p><div class="svgbox"><svg viewBox="0 0 700 ${D.diagram.h}" role="img" aria-label="${D.title} diagram"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="var(--mut)"/></marker></defs>${D.diagram.edges.map(e=>edge(e[0],e[1])).join("")}${D.diagram.nodes.map(node).join("")}</svg></div><div class="info" id="info"><b>Tap a box above.</b> A plain-language explanation shows here.</div>`;
h+=`<h2>Watch it happen</h2><p class="mut">Pick a situation, then tap Next step. The diagram lights up the parts involved.</p><div class="btns" id="sc"></div><ul class="steps" id="st"></ul><div class="btns"><button class="btn" id="nx">Next step</button><button class="btn" id="rs">Reset</button></div>`;
h+=`<h2>${D.tTitle}</h2><p class="mut">Pick a topic. Red notes say what goes wrong.</p>${tabs("tb",D.tabs)}`;
h+=`<h2>${D.cTitle}</h2><p class="mut">Grouped by task, with what each one does.</p>${tabs("cm",D.cmds)}`;
D.picks.forEach((p,i)=>{h+=`<h2>${p.title}</h2><p class="mut">${p.intro}</p><div class="btns" id="pk${i}">${p.items.map((x,j)=>`<button class="btn" data-j="${j}">${x[0]}</button>`).join("")}</div><div class="ans" id="pa${i}">Tap one.</div>`});
h+=`<h2>Settings that must agree</h2><p class="mut">Most real problems live where two things disagree.</p><div class="agree">${D.agree.map(a=>`<div class="ag"><div class="tg"><b>${a[0]}</b> ${a[1].map(t=>`<span style="background:${S[t[1]]};color:${C[t[1]]}">${t[0]}</span>`).join("↔ ")}</div>${a[2]}</div>`).join("")}</div>`;
h+=`<h2>Common mix-ups</h2><div class="mix">${D.mix.map(m=>`<div>${m}</div>`).join("")}</div><h2>Quick quiz</h2><div id="qz">${D.quiz.map((q,n)=>`<div class="q"><b>${n+1}. ${q[0]}</b>${q[1].map((o,j)=>`<button class="opt" data-n="${n}" data-j="${j}">${o}</button>`).join("")}<div class="mut" id="ex${n}"></div></div>`).join("")}</div><h2>Cheat sheet</h2><div class="cheat">${D.cheat.map(c=>`<div>${c}</div>`).join("")}</div>`;
$("#app").innerHTML=h;
$("#th").onclick=()=>{const d=document.documentElement,dk=d.dataset.theme?d.dataset.theme==="dark":matchMedia("(prefers-color-scheme:dark)").matches;d.dataset.theme=dk?"light":"dark";try{localStorage.setItem("th",d.dataset.theme)}catch(e){}};
const nodes=[...document.querySelectorAll(".n")];
nodes.forEach(n=>{const f=()=>{const k=n.dataset.k;$("#info").innerHTML=D.diagram.info[k];$("#info").style.borderLeftColor=C[N[k][7]]};n.onclick=f;n.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();f()}}});
function light(k){nodes.forEach(n=>{n.classList.toggle("hi",k.includes(n.dataset.k));n.classList.toggle("dim",k.length>0&&!k.includes(n.dataset.k))})}
let cur=null,i=0;
Object.keys(D.scen).forEach(k=>{const b=document.createElement("button");b.className="btn";b.textContent=k;b.onclick=()=>{cur=k;i=0;[...$("#sc").children].forEach(x=>x.classList.toggle("on",x===b));draw()};$("#sc").appendChild(b)});
function draw(){const ul=$("#st");ul.innerHTML="";if(!cur){light([]);return}D.scen[cur].forEach((s,j)=>{const li=document.createElement("li");li.innerHTML=(j+1)+". "+s[0];li.className=j<i?"done":j===i?"cur":"";ul.appendChild(li)});light(D.scen[cur][i][1])}
$("#nx").onclick=()=>{if(!cur){$("#st").innerHTML="<li class='cur'>Pick a situation first.</li>";return}if(i<D.scen[cur].length-1){i++;draw()}};
$("#rs").onclick=()=>{cur=null;i=0;[...$("#sc").children].forEach(x=>x.classList.remove("on"));draw()};
wireTabs("tb",D.tabs);wireTabs("cm",D.cmds);
D.picks.forEach((p,k)=>document.querySelectorAll("#pk"+k+" .btn").forEach(b=>b.onclick=()=>{document.querySelectorAll("#pk"+k+" .btn").forEach(x=>x.classList.toggle("on",x===b));const a=$("#pa"+k);a.innerHTML=p.items[b.dataset.j][1];a.style.borderLeftColor="var(--s)"}));
document.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{const n=+b.dataset.n,j=+b.dataset.j,q=D.quiz[n],sib=[...b.parentNode.querySelectorAll(".opt")];sib.forEach(x=>x.disabled=true);sib[q[2]].classList.add("ok");if(j!==q[2])b.classList.add("no");$("#ex"+n).innerHTML=(j===q[2]?"Correct. ":"Not quite. ")+q[3]});
</script></body></html>
