<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>EC2 notes part 1: pricing, launch, connect, storage</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap">
<style>
:root{--bg:#f6f8fb;--card:#fff;--ink:#16202e;--mut:#5b6778;--line:#d9e0ea;--a:#3b6cf0;--t:#c27a00;--s:#1f9d6b;--bad:#d6453d;--as:#e6edff;--ts:#fff1d6;--ss:#dcf5ea;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e141d;--card:#17202c;--ink:#e8eef7;--mut:#9aa7b9;--line:#2a3646;--a:#7da0ff;--t:#f2b43a;--s:#4fd19a;--bad:#ff7a70;--as:#1d2a4d;--ts:#40320f;--ss:#143a2c;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e141d;--card:#17202c;--ink:#e8eef7;--mut:#9aa7b9;--line:#2a3646;--a:#7da0ff;--t:#f2b43a;--s:#4fd19a;--bad:#ff7a70;--as:#1d2a4d;--ts:#40320f;--ss:#143a2c;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 "Bricolage Grotesque",system-ui,-apple-system,Segoe UI,sans-serif}
main{max-width:860px;margin:0 auto;padding:20px 16px 60px}
h1{font-size:clamp(28px,6vw,42px);line-height:1.1;margin:8px 0 10px;font-weight:800}
h2{font-size:24px;margin:44px 0 6px;font-weight:800}h3{margin:0 0 4px;font-size:18px}p{margin:6px 0}.mut{color:var(--mut)}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
button{font:inherit;cursor:pointer;color:var(--ink)}
.theme,.btn{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 14px}.theme{border-radius:20px;padding:4px 12px}
.btn.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.one{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-top:14px}
.a{color:var(--a);font-weight:800}.t{color:var(--t);font-weight:800}.s{color:var(--s);font-weight:800}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));margin-top:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;border-top:5px solid var(--c)}
.svgbox{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px;margin-top:12px}
svg{width:100%;height:auto;display:block}svg text{font-family:inherit;fill:var(--ink)}
.n{cursor:pointer}.n rect{stroke-width:2;transition:.2s}.n:hover rect,.n:focus rect{stroke-width:4}
.n.hi rect{stroke-width:5;filter:drop-shadow(0 0 6px var(--sc))}.n.dim{opacity:.35}
.ln{stroke:var(--mut);stroke-width:2;fill:none}.flow{stroke-dasharray:6 6;animation:d 1s linear infinite}
@keyframes d{to{stroke-dashoffset:-12}}@media (prefers-reduced-motion:reduce){.flow{animation:none}}
.info,.ans{margin-top:10px;padding:12px 14px;border-radius:12px;background:var(--card);border:1px solid var(--line);border-left:6px solid var(--mut);min-height:60px}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.steps{margin:10px 0 0;padding:0;list-style:none}
.steps li{padding:8px 12px;margin:6px 0;border-radius:10px;border:1px solid var(--line);background:var(--card);opacity:.45}
.steps li.cur{opacity:1;border-color:var(--ink);font-weight:600}.steps li.done{opacity:.85}
.tw{overflow-x:auto;margin-top:10px;border:1px solid var(--line);border-radius:12px;background:var(--card)}
table{border-collapse:collapse;width:100%;min-width:520px;font-size:14.5px}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}th{background:var(--bg)}td:first-child{font-weight:600}
code{font:13.5px ui-monospace,Menlo,Consolas,monospace;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:1px 6px;word-break:break-all}
.bad{color:var(--bad)}
.agree{display:grid;gap:10px;margin-top:12px}.ag{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.tg span{display:inline-block;font-size:13px;font-weight:600;padding:1px 9px;border-radius:12px;margin:0 6px 4px 0}
.mix div{padding:10px 12px;background:var(--card);border:1px solid var(--line);border-radius:12px;margin:8px 0}
.q{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:12px}
.opt{display:block;width:100%;text-align:left;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 12px;margin:6px 0}
.opt.ok{border-color:var(--s);background:var(--ss)}.opt.no{border-color:var(--bad)}
.cheat{background:var(--ink);color:var(--bg);border-radius:14px;padding:16px;margin-top:12px}.cheat div{margin:6px 0}.cheat code{color:var(--ink)}
.dec{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}.dec div{flex:1 1 150px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}.dec b{display:block;font-size:24px}
</style></head><body><main id="app"></main>
<script>
const D={
part:"EC2 notes, part 1 of 2",title:"EC2: rent a server, launch it, connect, store data",
sub:"From your class notes (03 to 20 Nov): pricing, launching a Linux instance, connecting, and storage.",
one:"<span class='s'>EC2</span> is a server you rent in minutes and pay for only while you use it. You pick the <span class='a'>ingredients</span> (AMI, key pair, security group) and attach <span class='t'>storage</span> (EBS, EFS).",
aTitle:"Think of a restaurant kitchen",
analogy:[["Server = the kitchen","Client (customer) sends a request, the server (kitchen) processes it and replies. EC2 is that kitchen, rented by the hour.","s"],["Old way = building your own","Physical servers, data center, power, UPS, cooling, security. Big CAPEX, and a festival sale (x2 traffic) means buying more hardware.","t"],["Cloud way = pay as you go","10 servers on normal days, 20 on festival days. You pay only for the hours used.","a"]],
extra:"<h2>Decode an instance name</h2><p class='mut'>Example: <code>t8i.micro</code>. Higher generation means better performance at a better price.</p><div class='dec'><div><b class='s'>t</b>family (general purpose)</div><div><b class='a'>8</b>generation</div><div><b class='t'>i</b>processor: i Intel, a AMD, g Graviton</div><div><b>.micro</b>size: CPU and memory</div></div><p class='mut'>Families: <b>T, M</b> general · <b>C</b> compute · <b>R, U, X, Z</b> memory · <b>I, D, H</b> storage · <b>P, G, Trn</b> GPU · <b>hpc</b> HPC.</p>",
dNote:"Blue boxes are what you choose at launch. Amber boxes are storage. Green is the server itself.",
diagram:{h:360,nodes:[["ami",20,30,140,64,"AMI","OS blueprint","a"],["key",20,148,140,64,"Key pair","public + private","a"],["sg",20,266,140,64,"Security group","firewall rules","a"],["ec2",270,130,160,100,"EC2 instance","your server","s"],["ebs",520,30,160,64,"EBS volume","disk","t"],["snap",520,148,160,64,"Snapshot","backup of EBS","t"],["efs",520,266,160,64,"EFS","shared files, NFS","t"]],
edges:[["ami","ec2"],["key","ec2"],["sg","ec2"],["ebs","ec2"],["efs","ec2"],["ebs","snap"]],
info:{ami:"Amazon Machine Image: a pre-installed, pre-configured operating system. You can also make your own AMI from a configured server.",key:"A lock and key. AWS keeps the public key (the lock) inside the instance. The private key (.pem) downloads to your laptop. One key pair can serve many instances.",sg:"A virtual firewall. Rules allow specific ports from specific sources. If the port is not open, you cannot connect.",ec2:"The server (an Azure VM or Compute Engine instance elsewhere). Start, use, stop and delete it whenever you like.",ebs:"The instance’s disk. Linux usually needs 8 to 10 GB, Windows at least 30 GB. It lives in one AZ.",snap:"A point-in-time, incremental backup of an EBS volume. You cannot browse files in it. Create a volume from it to see the data.",efs:"Shared file storage over NFS (port 2049). Linux only, no pre-provisioning, mountable from many instances across AZs."}},
scen:{"Launch an instance":[["<b>Tags</b>: Name, Project, Cost centre, OS, Client.",["ec2"]],["<b>Pick an AMI</b>, the operating system to start from.",["ami"]],["<b>Pick a type</b>, like <code>t3.small</code> or <code>t8i.small</code> on a free account.",["ec2"]],["<b>Key pair</b>: create or choose one. The private key downloads to you.",["key"]],["<b>Network</b>: open SSH 22 (Linux) or RDP 3389 (Windows) in the security group.",["sg"]],["<b>Storage</b>: 8 to 10 GB for Linux, 30 GB minimum for Windows. Launch.",["ebs","ec2"]]],
"Cannot connect":[["Browser shows <code>ERR_CONNECTION_TIMED_OUT</code>: the request never reached the server.",["sg"]],["Check the security group has the right port (22 or 3389) and your source (My IP).",["sg"]],["<code>ERR_CONNECTION_REFUSED</code> means you reached it, but nothing is listening on that port.",["ec2"]],["Linux: <code>Permissions are too open</code>. Fix with <code>chmod 400 key.pem</code>.",["key"]],["Connect with <code>ssh -i key.pem ec2-user@IP</code>.",["key","ec2"]]],
"Back up a volume":[["Create a snapshot of the EBS volume. It captures that exact moment.",["ebs","snap"]],["Snapshots are incremental, so the most recent one is enough to restore.",["snap"]],["Need the data? Create a new volume from the snapshot and attach it.",["snap","ebs"]],["Automate with DLM: filter by tags, set frequency and retention.",["snap"]]],
"Encrypt an old volume":[["There is no switch to encrypt an existing volume directly.",["ebs"]],["Snapshot the unencrypted volume.",["snap"]],["Create a new volume from the snapshot and tick Encryption.",["ebs"]],["Detach the old volume and attach the new encrypted one.",["ec2","ebs"]]]},
tTitle:"Settings and facts to know",
tabs:{"Buying options":{h:["Option","Commitment","Discount","Best for","Catch"],r:[["On-Demand","none, per second/hour","none","Dev/QA, short or unpredictable","<span class='bad'>Most expensive per hour, costly 24/7</span>"],["Reserved (Standard)","1 or 3 years","up to 72%","Steady 24/7 use","<span class='bad'>Cannot change instance family</span> (AZ and size within the family are fine)"],["Reserved (Convertible)","1 or 3 years","smaller","Needs flexibility","Exchange for another convertible RI (family, OS, tenancy)"],["Spot","none","up to 90%","Batch, rendering, big data, ML training","<span class='bad'>Interrupted with 2 minutes’ warning</span>"],["Savings Plan","$ per hour, 1 or 3 years","good","Modern replacement for RIs","Compute (EC2, Lambda, Fargate), EC2 Instance (one region), SageMaker, Database"],["RI payment","All / Partial / No upfront","All upfront is highest","Pick by cash flow","No upfront costs about the same as on-demand but reserves capacity"]]},
"Launch settings":{h:["Setting","What it is","Remember"],r:[["Tags","Name, Project, Cost centre, OS, Client","Used later for cost tracking and DLM backups"],["AMI","Pre-installed OS image","Linux login user is <code>ec2-user</code> on Amazon Linux"],["Instance type","CPU and memory size","Free account: t3.micro, t3.small, t8i.small, t8i.micro and the flex types"],["Key pair","Public (lock) + private (key)","Linux: key logs you in (.pem or .ppk). Windows: key decrypts the password"],["Security group","Firewall rules","Source: Anywhere <code>0.0.0.0/0</code>, Custom (office IPs), or My IP. Real projects avoid Anywhere"],["Storage","EBS size","Linux 8 to 10 GB, Windows 30 GB minimum"]]},
"Ports":{h:["Port","Service","Used for"],r:[["22","SSH","Linux login"],["3389","RDP","Windows remote desktop"],["80 / 443","HTTP / HTTPS","Web traffic"],["53","DNS","Name lookup"],["20, 21","FTP","File transfer"],["3306","MySQL","Database"],["1433","MSSQL","Database"],["5432","PostgreSQL","Database"],["2049","NFS","EFS file share"]]},
"Storage":{h:["Thing","What it does","Remember"],r:[["EBS","Disk for one instance","Format with <code>mkfs</code>, mount it, add to <code>/etc/fstab</code> to survive reboot"],["Snapshot","Point-in-time backup","Default-encrypted snapshots cannot be shared with another account. Never make them public"],["DLM","Automates snapshots","Filters by tags. Example: prod every 3 to 4 hrs, keep 7 days. Non-prod every 12 hrs, keep 3 days"],["EFS","Shared NFS storage","Linux only, many instances, many AZs, no pre-provisioning"],["AMI","Your own template","Configure once, launch 10 copies instead of configuring 10 times"],["RTO / RPO","Downtime and data-loss limits","RTO: how long we can be offline. RPO: how much data we can lose, so how often to back up"]]}},
cTitle:"Linux commands from your notes",
cmds:{"Connect":{h:["Command","What it does"],r:[["<code>chmod 400 key.pem</code>","Make the key readable only by you (required)"],["<code>ssh -i key.pem ec2-user@IP</code>","Log in to the instance with your key"],["<code>whoami</code>","Show the user you are logged in as"],["<code>icacls \"path\" /inheritance:r</code>","Windows: remove inherited permissions on the key"],["<code>icacls \"path\" /grant:r \"$($env:USERNAME):(F)\"</code>","Windows: give only your user full control, fixes “Permissions too open”"]]},
"Add a disk":{h:["Command","What it does"],r:[["<code>sudo file -s /dev/nvme1n1</code>","Check whether the new disk has a file system (data means empty)"],["<code>sudo mkfs -t xfs /dev/nvme1n1</code>","Format the disk with XFS"],["<code>sudo mkdir /mnt/tesvol</code>","Create a folder to mount it on"],["<code>sudo mount /dev/nvme1n1 /mnt/tesvol</code>","Mount the disk (lost on reboot)"],["<code>sudo vim /etc/fstab</code> then <code>mount -a</code>","Make it permanent, then test the entry"],["<code>tail -n 1 /etc/mtab</code>","See the mounted disk"]]}},
picks:[{title:"Which buying option?",intro:"Tap a situation to see the best fit.",items:[["Testing for a week","<b>On-Demand.</b> No commitment, pay per second. Ideal for Dev/QA and unpredictable work."],["Runs 24/7 for 3 years","<b>Reserved Instance or Savings Plan.</b> Up to 72% off. Pick Standard RI for the biggest discount if the family will not change."],["Might change instance family","<b>Convertible RI</b> (smaller discount, exchangeable) or a <b>Compute Savings Plan</b>."],["Batch job that can restart","<b>Spot.</b> Up to 90% off, but AWS can take the capacity back with a 2-minute warning."],["Spend across EC2, Lambda, Fargate","<b>Compute Savings Plan.</b> One hourly commitment across services."]]},
{title:"Interview questions",intro:"Tap a question to reveal a short answer.",items:[["Server reachable only from office users?","Set the security group source to <b>Custom</b> with the office public IPs. Avoid Anywhere (0.0.0.0/0) in real projects."],["Enable encryption on an existing volume?","No direct option. Snapshot it, create a new volume from the snapshot with encryption on, detach the old volume, attach the new one."],["Can we browse files inside a snapshot?","No. Create a volume from it and attach it to an instance first."],["Explain your EC2 backup strategy","Use DLM. Filter resources by tags, set frequency (prod 3 to 4 hrs, non-prod 12 hrs) and retention (prod 7 days, non-prod 3 days)."],["Launch 10 identical servers fast?","Configure one, create a custom AMI from it, then launch 10 from that AMI. 1x work instead of 10x."],["How to share a default-encrypted snapshot?","You cannot. The other account cannot decrypt it. Use a customer-managed key instead."]]}],
agree:[["Port",[["Security group","a"],["OS","s"]],"Linux needs 22 (SSH), Windows needs 3389 (RDP). Wrong or closed port gives a timed out error."],["Key permissions",[["Key file","a"],["SSH","s"]],"Run <code>chmod 400</code> or SSH refuses with “Permissions are too open”."],["Key use",[["Key pair","a"],["Windows","s"]],"On Windows the key is only used to decrypt the Administrator password."],["EFS access",[["EFS SG","t"],["Web server SG","a"]],"EFS uses NFS port 2049. Its security group must allow 2049 from the web servers’ group."],["Backup rate",[["RPO","t"],["DLM frequency","t"]],"If RPO is 2 hours, snapshots must run every 2 hours or less."],["Backups by tag",[["Tags","a"],["DLM","t"]],"DLM finds volumes by tags, so consistent tagging is what makes backups work."]],
mix:["<b>Standard vs Convertible RI?</b> Standard: biggest discount, fixed family. Convertible: smaller discount, can exchange.","<b>Spot vs On-Demand?</b> Spot is far cheaper but can be taken away. Never use it for something that cannot restart.","<b>EBS vs EFS?</b> EBS is one disk for one instance. EFS is shared by many instances over NFS, Linux only.","<b>Timed out vs Refused?</b> Timed out: blocked before reaching the server (security group). Refused: reached the server, nothing listening on that port.","<b>Windows connections?</b> Two concurrent remote desktop sessions by default. A third user waits until someone logs out."],
quiz:[["Which option gives up to 90% off but can be interrupted?",["Reserved","Spot","Savings Plan"],1,"Spot uses spare capacity and gives a 2-minute warning."],["In t8i.micro, what does the “8” mean?",["Size","Generation","CPU count"],1,"Higher generation means better performance and price."],["Which port do you open to SSH into Linux?",["3389","80","22"],2,"3389 is for Windows RDP."],["On Linux, what does the private key do?",["Authenticates you directly","Is stored by AWS","Opens port 22"],0,"AWS keeps the public key, you keep the private one."],["Easiest way to launch 10 identical configured servers?",["Configure each","Custom AMI","Snapshot them"],1,"Configure once, make an AMI, launch 10 from it."]],
cheat:["<b>Pricing:</b> On-Demand flexible · RI up to 72% · Spot up to 90% · Savings Plan = $/hr commitment","<b>Launch:</b> Tags → AMI → Type → Key pair → Security group → Storage","<b>Ports:</b> 22 SSH · 3389 RDP · 80/443 web · 2049 NFS · 3306 MySQL · 5432 Postgres","<b>Connect:</b> <code>chmod 400</code> then <code>ssh -i key.pem ec2-user@IP</code>","<b>Disk:</b> <code>mkfs</code> → <code>mkdir</code> → <code>mount</code> → <code>fstab</code> → <code>mount -a</code>","<b>Backup:</b> Snapshot (incremental) · DLM by tags · RTO downtime · RPO data loss","<b>Encrypt old volume:</b> snapshot → new encrypted volume → swap"]};

const $=s=>document.querySelector(s),C={a:"var(--a)",t:"var(--t)",s:"var(--s)",n:"var(--mut)"},S={a:"var(--as)",t:"var(--ts)",s:"var(--ss)",n:"var(--card)"};
try{const v=localStorage.getItem("th");if(v)document.documentElement.dataset.theme=v}catch(e){}
const N={};D.diagram.nodes.forEach(n=>N[n[0]]=n);
function edge(a,b){const A=N[a],B=N[b],ax=A[1]+A[3]/2,ay=A[2]+A[4]/2,bx=B[1]+B[3]/2,by=B[2]+B[4]/2,dx=bx-ax,dy=by-ay;
const cl=(n,x,y,k)=>{const t=k*Math.min(n[3]/2/Math.abs(x||1e-9),n[4]/2/Math.abs(y||1e-9)),cx=n[1]+n[3]/2,cy=n[2]+n[4]/2;return[cx+x*t,cy+y*t]};
const p=cl(A,dx,dy,1),q=cl(B,-dx,-dy,1.07);return `<path class="ln flow" d="M${p[0]} ${p[1]}L${q[0]} ${q[1]}" marker-end="url(#ar)"/>`}
function node(n){const c=n[7];return `<g class="n" data-k="${n[0]}" tabindex="0" style="--sc:${C[c]}"><rect x="${n[1]}" y="${n[2]}" width="${n[3]}" height="${n[4]}" rx="12" fill="${S[c]}" stroke="${C[c]}"/><text x="${n[1]+n[3]/2}" y="${n[2]+n[4]/2-(n[6]?2:-5)}" text-anchor="middle" font-weight="800" style="fill:${C[c]}">${n[5]}</text>${n[6]?`<text x="${n[1]+n[3]/2}" y="${n[2]+n[4]/2+16}" text-anchor="middle" font-size="12.5">${n[6]}</text>`:""}</g>`}
function tabs(id,T){return `<div class="btns" id="${id}b">${Object.keys(T).map((k,i)=>`<button class="btn${i?"":" on"}" data-k="${k}">${k}</button>`).join("")}</div><div class="tw"><table><thead id="${id}h"></thead><tbody id="${id}t"></tbody></table></div>`}
function wireTabs(id,T){const f=k=>{$("#"+id+"h").innerHTML="<tr>"+T[k].h.map(x=>"<th>"+x+"</th>").join("")+"</tr>";$("#"+id+"t").innerHTML=T[k].r.map(r=>"<tr>"+r.map(x=>"<td>"+x+"</td>").join("")+"</tr>").join("")};
document.querySelectorAll("#"+id+"b .btn").forEach(b=>b.onclick=()=>{document.querySelectorAll("#"+id+"b .btn").forEach(x=>x.classList.toggle("on",x===b));f(b.dataset.k)});f(Object.keys(T)[0])}
let h=`<div class="top"><span class="mut">${D.part}</span><button class="theme" id="th">Dark / Light</button></div><h1>${D.title}</h1><p class="mut">${D.sub}</p><div class="one">${D.one}</div>`;
h+=`<h2>${D.aTitle}</h2><div class="grid">${D.analogy.map(a=>`<div class="card" style="--c:${C[a[2]]}"><h3 class="${a[2]}">${a[0]}</h3><p>${a[1]}</p></div>`).join("")}</div>`;
if(D.extra)h+=D.extra;
h+=`<h2>The big picture (tap any box)</h2><p class="mut">${D.dNote}</p><div class="svgbox"><svg viewBox="0 0 700 ${D.diagram.h}" role="img" aria-label="${D.title} diagram"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="var(--mut)"/></marker></defs>${D.diagram.edges.map(e=>edge(e[0],e[1])).join("")}${D.diagram.nodes.map(node).join("")}</svg></div><div class="info" id="info"><b>Tap a box above.</b> A plain-language explanation shows here.</div>`;
h+=`<h2>Watch it happen</h2><p class="mut">Pick a situation, then tap Next step. The diagram lights up the parts involved.</p><div class="btns" id="sc"></div><ul class="steps" id="st"></ul><div class="btns"><button class="btn" id="nx">Next step</button><button class="btn" id="rs">Reset</button></div>`;
h+=`<h2>${D.tTitle}</h2><p class="mut">Pick a topic. Red notes say what goes wrong.</p>${tabs("tb",D.tabs)}`;
h+=`<h2>${D.cTitle}</h2><p class="mut">Grouped by task, with what each one does.</p>${tabs("cm",D.cmds)}`;
D.picks.forEach((p,i)=>{h+=`<h2>${p.title}</h2><p class="mut">${p.intro}</p><div class="btns" id="pk${i}">${p.items.map((x,j)=>`<button class="btn" data-j="${j}">${x[0]}</button>`).join("")}</div><div class="ans" id="pa${i}">Tap one.</div>`});
h+=`<h2>Settings that must agree</h2><p class="mut">Most real problems live where two things disagree.</p><div class="agree">${D.agree.map(a=>`<div class="ag"><div class="tg"><b>${a[0]}</b> ${a[1].map(t=>`<span style="background:${S[t[1]]};color:${C[t[1]]}">${t[0]}</span>`).join("↔ ")}</div>${a[2]}</div>`).join("")}</div>`;
h+=`<h2>Common mix-ups</h2><div class="mix">${D.mix.map(m=>`<div>${m}</div>`).join("")}</div><h2>Quick quiz</h2><div id="qz">${D.quiz.map((q,n)=>`<div class="q"><b>${n+1}. ${q[0]}</b>${q[1].map((o,j)=>`<button class="opt" data-n="${n}" data-j="${j}">${o}</button>`).join("")}<div class="mut" id="ex${n}"></div></div>`).join("")}</div><h2>Cheat sheet</h2><div class="cheat">${D.cheat.map(c=>`<div>${c}</div>`).join("")}</div>`;
$("#app").innerHTML=h;
$("#th").onclick=()=>{const d=document.documentElement,dk=d.dataset.theme?d.dataset.theme==="dark":matchMedia("(prefers-color-scheme:dark)").matches;d.dataset.theme=dk?"light":"dark";try{localStorage.setItem("th",d.dataset.theme)}catch(e){}};
const nodes=[...document.querySelectorAll(".n")];
nodes.forEach(n=>{const f=()=>{const k=n.dataset.k;$("#info").innerHTML=D.diagram.info[k];$("#info").style.borderLeftColor=C[N[k][7]]};n.onclick=f;n.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();f()}}});
function light(k){nodes.forEach(n=>{n.classList.toggle("hi",k.includes(n.dataset.k));n.classList.toggle("dim",k.length>0&&!k.includes(n.dataset.k))})}
let cur=null,i=0;
Object.keys(D.scen).forEach(k=>{const b=document.createElement("button");b.className="btn";b.textContent=k;b.onclick=()=>{cur=k;i=0;[...$("#sc").children].forEach(x=>x.classList.toggle("on",x===b));draw()};$("#sc").appendChild(b)});
function draw(){const ul=$("#st");ul.innerHTML="";if(!cur){light([]);return}D.scen[cur].forEach((s,j)=>{const li=document.createElement("li");li.innerHTML=(j+1)+". "+s[0];li.className=j<i?"done":j===i?"cur":"";ul.appendChild(li)});light(D.scen[cur][i][1])}
$("#nx").onclick=()=>{if(!cur){$("#st").innerHTML="<li class='cur'>Pick a situation first.</li>";return}if(i<D.scen[cur].length-1){i++;draw()}};
$("#rs").onclick=()=>{cur=null;i=0;[...$("#sc").children].forEach(x=>x.classList.remove("on"));draw()};
wireTabs("tb",D.tabs);wireTabs("cm",D.cmds);
D.picks.forEach((p,k)=>document.querySelectorAll("#pk"+k+" .btn").forEach(b=>b.onclick=()=>{document.querySelectorAll("#pk"+k+" .btn").forEach(x=>x.classList.toggle("on",x===b));const a=$("#pa"+k);a.innerHTML=p.items[b.dataset.j][1];a.style.borderLeftColor="var(--s)"}));
document.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{const n=+b.dataset.n,j=+b.dataset.j,q=D.quiz[n],sib=[...b.parentNode.querySelectorAll(".opt")];sib.forEach(x=>x.disabled=true);sib[q[2]].classList.add("ok");if(j!==q[2])b.classList.add("no");$("#ex"+n).innerHTML=(j===q[2]?"Correct. ":"Not quite. ")+q[3]});
</script></body></html>
